<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Classic Upright Arcade Cabinet Silhouette (FBNeo) -->
  <!-- Marquee hood & side profile -->
  <path d="M7 2.5H17L18 5.5L16.5 6.5V10.5L19 12.5V21.5H5V12.5L7.5 10.5V6.5L6 5.5L7 2.5Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Marquee header -->
  <rect x="7.5" y="3.8" width="9" height="1.8" rx="0.4" fill="#FFFFFF"/>
  <!-- CRT Screen bezel -->
  <rect x="8.2" y="6.8" width="7.6" height="4.2" rx="0.6" stroke="#FFFFFF" stroke-width="1.2"/>
  <!-- Control deck joystick & buttons -->
  <line x1="8.5" y1="12.5" x2="8.5" y2="10.8" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="8.5" cy="10.4" r="0.9" fill="#FFFFFF"/>
  <circle cx="13" cy="12.1" r="0.7" fill="#FFFFFF"/>
  <circle cx="15" cy="12.1" r="0.7" fill="#FFFFFF"/>
  <!-- Coin door -->
  <rect x="9.5" y="14.5" width="5" height="4.5" rx="0.5" stroke="#FFFFFF" stroke-width="1.2"/>
  <line x1="12" y1="14.5" x2="12" y2="19" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="10.75" cy="16.2" r="0.45" fill="#FFFFFF"/>
  <circle cx="13.25" cy="16.2" r="0.45" fill="#FFFFFF"/>
</svg>
