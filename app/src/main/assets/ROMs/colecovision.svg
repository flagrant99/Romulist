<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- ColecoVision Controller -->
  <rect x="6.5" y="2.5" width="11" height="19" rx="1.8" stroke="#FFFFFF" stroke-width="1.6"/>
  <!-- Top circular control disc/stick -->
  <circle cx="12" cy="7.2" r="2.6" stroke="#FFFFFF" stroke-width="1.3"/>
  <circle cx="12" cy="7.2" r="1" fill="#FFFFFF"/>
  <!-- Side fire buttons -->
  <rect x="4.8" y="6" width="1.7" height="3" rx="0.6" fill="#FFFFFF"/>
  <rect x="17.5" y="6" width="1.7" height="3" rx="0.6" fill="#FFFFFF"/>
  <!-- 3x4 Keypad grid -->
  <circle cx="9.5" cy="12.5" r="0.7" fill="#FFFFFF"/>
  <circle cx="12" cy="12.5" r="0.7" fill="#FFFFFF"/>
  <circle cx="14.5" cy="12.5" r="0.7" fill="#FFFFFF"/>
  <circle cx="9.5" cy="14.7" r="0.7" fill="#FFFFFF"/>
  <circle cx="12" cy="14.7" r="0.7" fill="#FFFFFF"/>
  <circle cx="14.5" cy="14.7" r="0.7" fill="#FFFFFF"/>
  <circle cx="9.5" cy="16.9" r="0.7" fill="#FFFFFF"/>
  <circle cx="12" cy="16.9" r="0.7" fill="#FFFFFF"/>
  <circle cx="14.5" cy="16.9" r="0.7" fill="#FFFFFF"/>
  <circle cx="9.5" cy="19.1" r="0.7" fill="#FFFFFF"/>
  <circle cx="12" cy="19.1" r="0.7" fill="#FFFFFF"/>
  <circle cx="14.5" cy="19.1" r="0.7" fill="#FFFFFF"/>
</svg>
