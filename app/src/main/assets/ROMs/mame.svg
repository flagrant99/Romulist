<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Arcade Fightstick / Control Panel (MAME) -->
  <!-- Sloped arcade stick housing -->
  <rect x="2.5" y="7" width="19" height="11.5" rx="2.2" stroke="#FFFFFF" stroke-width="1.6"/>
  <!-- Top deck divider line -->
  <line x1="2.8" y1="15.2" x2="21.2" y2="15.2" stroke="#FFFFFF" stroke-width="1.2"/>
  <!-- Ball-top joystick on left -->
  <circle cx="7.5" cy="11.2" r="2.1" stroke="#FFFFFF" stroke-width="1.1"/>
  <circle cx="7.5" cy="11.2" r="1.1" fill="#FFFFFF"/>
  <!-- 6-button Japanese/American arcade layout on right -->
  <circle cx="12.5" cy="10.2" r="0.95" fill="#FFFFFF"/>
  <circle cx="15.2" cy="9.6" r="0.95" fill="#FFFFFF"/>
  <circle cx="17.9" cy="10.2" r="0.95" fill="#FFFFFF"/>
  <circle cx="12.5" cy="12.8" r="0.95" fill="#FFFFFF"/>
  <circle cx="15.2" cy="12.2" r="0.95" fill="#FFFFFF"/>
  <circle cx="17.9" cy="12.8" r="0.95" fill="#FFFFFF"/>
  <!-- Start / Coin service buttons on front lip -->
  <rect x="6" y="16.3" width="2.2" height="1" rx="0.5" fill="#FFFFFF"/>
  <rect x="9.5" y="16.3" width="2.2" height="1" rx="0.5" fill="#FFFFFF"/>
</svg>
