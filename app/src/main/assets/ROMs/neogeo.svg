<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- SNK Neo Geo AES / Arcade Stick Wedge Controller -->
  <rect x="2" y="5.5" width="20" height="13" rx="2" stroke="#FFFFFF" stroke-width="1.6"/>
  <!-- Top Service Buttons (Select / Start) -->
  <rect x="5" y="7.5" width="2.2" height="1" rx="0.5" fill="#FFFFFF"/>
  <rect x="8.2" y="7.5" width="2.2" height="1" rx="0.5" fill="#FFFFFF"/>
  <!-- Left Ball-Top Joystick -->
  <circle cx="7" cy="13.2" r="2.7" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="7" cy="13.2" r="1.4" fill="#FFFFFF"/>
  <!-- Curved 4-Button Arcade Layout (A, B, C, D) -->
  <circle cx="12.5" cy="14.2" r="1.15" fill="#FFFFFF"/>
  <circle cx="14.8" cy="12.6" r="1.15" fill="#FFFFFF"/>
  <circle cx="17.3" cy="11.6" r="1.15" fill="#FFFFFF"/>
  <circle cx="19.7" cy="11.2" r="1.15" fill="#FFFFFF"/>
</svg>
